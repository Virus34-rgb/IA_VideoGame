# ============================================================
# Configuración del proyecto Castle Game
# ============================================================

# Parámetros de ejecución
VERSION: 1
RUN_NAME_SUFFIX: "TestvsIA2500"
N_BATCH: 2048
TRAIN_EPISODES: 1
EVAL_EPISODES: 1
SEED: null

# Flags del juego
USE_META_GAME: true
USE_WANDB: false
RUN_COMPARISON: false
DELETE_DIRECTORIES: true

# Flags de ejecución
RUN_SELF_PLAY: true
RUN_EVALUATION: true
HUMAN_OPPONENT: "ia1"
HUMAN_EPISODES: 20
HUMAN_EPSILON: 0.1
PLAY_AGAINST_AI: true
USE_GUI: true
PLAY_EPISODES: 20
PLAY_EPSILON: 0.0

# ============================================================
# Comparaciones de runs (solo se usan si RUN_COMPARISON = true)
# ============================================================
comparisons:
  - run_name: "no_clip"
    N: 2048
    train_batches: 150
    eval_batches: 20
    seed: 42
    overrides:
      GRAD_CLIP_MAX_NORM: 1000000.0   # equivalente a "sin clip" en la práctica

  - run_name: "clip_norm1"
    N: 2048
    train_batches: 150
    eval_batches: 20
    seed: 42
    overrides:
      GRAD_CLIP_MAX_NORM: 1.0