# ============================================================
# Configuración del proyecto Castle Game
# ============================================================

VERSION: 2
RUN_NAME_SUFFIX: "RusherKiller_1000"
N_BATCH: 2048
TRAIN_EPISODES: 1000
EVAL_EPISODES: 300
SEED: 42

RUN_RUSHER_FINETUNE: true   # irrelevante con RUN_COMPARISON: true — cada RunSpec lo sobrescribe
RUSHER_FINETUNE_EPISODES: 1000
RUSHER_OPPONENT_PERCENTAGE: 0.3
RUN_RUSHER_TESTS: true
RUSHER_TEST_EPISODES: 300
RUSHER_TEST_EPSILON: 0.00

USE_META_GAME: true
USE_WANDB: false
RUN_COMPARISON: false
DELETE_DIRECTORIES: false

RUN_SELF_PLAY: true
RUN_EVALUATION: true
HUMAN_OPPONENT: "none"
HUMAN_EPISODES: 20
HUMAN_EPSILON: 0.1
PLAY_AGAINST_AI: false
USE_GUI: true
PLAY_EPISODES: 20
PLAY_EPSILON: 0.0

# ============================================================
# Comparación: mismo self-play, solo cambia si hay finetune
# ============================================================
comparisons:
  - run_name: "baseline_no_finetune"
    N: 2048
    train_batches: 100
    eval_batches: 50
    seed: 42
    overrides:
      RUN_RUSHER_FINETUNE: false

  - run_name: "with_rusher_finetune"
    N: 2048
    train_batches: 100
    eval_batches: 50
    seed: 42
    overrides:
      RUN_RUSHER_FINETUNE: true