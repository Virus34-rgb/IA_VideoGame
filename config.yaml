# ============================================================
# Configuración del proyecto Castle Game
# ============================================================

# Parámetros de ejecución
VERSION: 1
RUN_NAME_SUFFIX: "evaluacion_1000_250_2"
N_BATCH: 2048
TRAIN_EPISODES: 1000
EVAL_EPISODES: 250

# Flags del juego
USE_META_GAME: true
USE_WANDB: true
RUN_COMPARISON: false
DELETE_DIRECTORIES: true

# Flags de ejecución
RUN_SELF_PLAY: true
RUN_EVALUATION: true
HUMAN_OPPONENT: "none"
HUMAN_EPISODES: 20
HUMAN_EPSILON: 0.1
PLAY_AGAINST_AI: false
PLAY_EPISODES: 20
PLAY_EPSILON: 0.0

# ============================================================
# Comparaciones de runs (solo se usan si RUN_COMPARISON = true)
# ============================================================
comparisons:
  - run_name: "baseline"
    N: 2048
    train_batches: 50
    eval_batches: 10
    overrides: {}

  - run_name: "64"
    N: 2048
    train_batches: 50
    eval_batches: 10
    overrides:
      SELECTION_REPLAYS_PER_BATCH: 288 # Número de replays de selección por lote
      TURN_REPLAYS_PER_BATCH: 960       # Número de replays de turno por lote
      BATCH_SIZE: 64