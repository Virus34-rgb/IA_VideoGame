# ============================================================
# Configuración del proyecto Castle Game
# ============================================================

VERSION: 2
RUN_NAME_SUFFIX: "BASE_50"
N_BATCH: 2048
TRAIN_EPISODES: 50
EVAL_EPISODES: 20
SEED: 42
PROFILE_CPROFILE : false       # Activa cProfile (global)
PROFILE_TORCH : false            # Activa torch.profiler (solo primeros batches)
PROFILE_TORCH_BATCHES : 3        # Número de batches a perfilar con torch
PROFILE_CPROFILE_OUTPUT : "optimizedAll2.prof"

# ============================================================
# Multi-seed (solo activo si MULTI_SEED_ENABLED: true)
# ============================================================
MULTI_SEED_ENABLED: true
MULTI_SEED_LIST: [42, 43, 44]
MULTI_SEED_BASELINE: 

EXPERIMENT_ID: "EXP_00"
EXPERIMENT_OBJETIVO: "BASE_50, save_every=10, pool_every=5 (calendario absoluto)"
EXPERIMENT_NOTA: "Se establece TRD a 200k fijo"
EXPERIMENT_OVERRIDES:
  TURN_REPLAY_DATA: 262144

RUN_RUSHER_FINETUNE: false
RUSHER_FINETUNE_EPISODES: 5
RUSHER_OPPONENT_PERCENTAGE: 0.0
RUN_RUSHER_TESTS: true
RUSHER_TEST_EPISODES: 20
RUSHER_TEST_EPSILON: 0.00

USE_META_GAME: true
USE_WANDB: false
RUN_COMPARISON: false
DELETE_DIRECTORIES: false

RUN_SELF_PLAY: true
RUN_EVALUATION: true
HUMAN_OPPONENT: "none"
HUMAN_EPISODES: 20
HUMAN_EPSILON: 0.1
PLAY_AGAINST_AI: false
USE_GUI: true
PLAY_EPISODES: 20
PLAY_EPSILON: 0.0

# ============================================================
# Comparación: mismo self-play, solo cambia si hay finetune
# ============================================================
comparisons:
  - run_name: "baseline_no_finetune"
    N: 2048
    train_batches: 100
    eval_batches: 50
    seed: 42
    overrides:
      RUN_RUSHER_FINETUNE: false

  - run_name: "with_rusher_finetune"
    N: 2048
    train_batches: 100
    eval_batches: 50
    seed: 42
    overrides:
      RUN_RUSHER_FINETUNE: true